# Copy to $XDG_CONFIG_HOME/melibea/games.toml (or ~/.config/melibea/games.toml).
#
# Most games need no rule: Melibea recognizes Steam, Wine and Proton games from
# the environment of the process that owns the window. Rules are for native
# non-Steam games and for `standby_after`, and they win over that detection.
# They are resolved top to bottom; the first match wins.
#
# Name `app_id` in every rule and anchor `title` with `^`: a title-only rule
# also matches a browser tab named after the game ("Terraria Wiki - Mozilla
# Firefox").

# A native non-Steam game found by the name of its executable.
[[game]]
app_id = "^mygame$"         # regex, optional
title = "^My Game$"         # regex, optional; at least one of the two
process = "mygame"          # this, or steam_app_id, or neither

# Suspend a game after it stays minimized this long (any game with a rule).
[[game]]
app_id = "^steam_proton$"
title = "^Victoria 3$"
process = "victoria3.exe"
standby_after = "5m"
