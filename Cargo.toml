[package]
name = "melibea"
version = "0.1.0"
edition = "2024"
description = "Deterministic attention and surface-state controller for niri"
license = "MIT"
publish = false

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
